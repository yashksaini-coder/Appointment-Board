services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appointments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointments}
      POSTGRES_DB: ${POSTGRES_DB:-appointments}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appointments} -d ${POSTGRES_DB:-appointments}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-appointments}:${POSTGRES_PASSWORD:-appointments}@db:5432/${POSTGRES_DB:-appointments}
      CORS_ORIGINS: http://localhost:5173,http://localhost:${WEB_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
